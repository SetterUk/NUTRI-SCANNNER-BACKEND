name: Keep Render Alive

on:
  schedule:
    # Runs every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          echo "Pinging Render backend to keep instance warm..."
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 --retry 2 https://nutri-scanner-api.onrender.com/health)
          echo "Response code: $response"
          if [ "$response" -eq 200 ]; then
            echo "✅ Server is alive and responsive!"
          else
            echo "⚠️ Server returned status $response"
          fi

